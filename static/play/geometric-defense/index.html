<!doctype html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <title>Geometric Defense</title>
    <meta name="title" content="Geometric Defense - Geometric Tower Defense">
    <meta name="description" content="A tower defense game where everything is geometric shapes. Combine towers in 2x2 grids for more powerful versions.">
    <meta name="viewport" content="width=device-width">

    <style>
        body {
            margin: 0px;
            overflow: hidden;
            background-color: black;
        }
        canvas.game_canvas {
            border: 0px none;
            background-color: black;
            padding-left: 0;
            padding-right: 0;
            margin-left: auto;
            margin-right: auto;
            display: block;
        }
    </style>
</head>
<body>
    <canvas class="game_canvas" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1" onmousedown="event.target.focus()" onkeydown="event.preventDefault()"></canvas>

    <!-- Hidden file input for save import -->
    <input type="file" id="saveFileInput" accept=".json" style="display:none"
           onchange="if(this.files[0]) importSave(this.files[0])">

    <!-- IMPORTANT: Using absolute paths to avoid relative path resolution issues -->
    <script type="text/javascript" src="/play/geometric-defense/odin.js"></script>
    <script>
        var odinMemoryInterface = new odin.WasmMemoryInterface();
        odinMemoryInterface.setIntSize(4);
        var odinImports = odin.setupDefaultImports(odinMemoryInterface);

        // The Module is used as configuration for emscripten.
        var Module = {
            // Tell Emscripten where to find the .data and .wasm files
            locateFile: function(path, prefix) {
                if (path.endsWith(".data")) return "/play/geometric-defense/" + path;
                if (path.endsWith(".wasm")) return "/play/geometric-defense/" + path;
                return prefix + path;
            },
            // This is called by emscripten when it starts up.
            instantiateWasm: (imports, successCallback) => {
                const newImports = {
                    ...odinImports,
                    ...imports
                }

                // IMPORTANT: Absolute path to WASM file
                return WebAssembly.instantiateStreaming(fetch("/play/geometric-defense/index.wasm"), newImports).then(function(output) {
                    var e = output.instance.exports;
                    odinMemoryInterface.setExports(e);
                    odinMemoryInterface.setMemory(e.memory);
                    return successCallback(output.instance);
                });
            },
            // This happens a bit after `instantiateWasm`, when everything is
            // done setting up. At that point we can run code.
            onRuntimeInitialized: () => {
                var e = wasmExports;

                // Check for pending save import before game loads
                checkPendingImport();

                // Calls any procedure marked with @init
                e._start();

                // See source/main_web/main_web.odin for main_start,
                // main_update and main_end.
                e.main_start();

                function send_resize() {
                    var canvas = document.getElementById('canvas');
                    // Resize canvas to fill the window
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                    // Tell the game about the new size
                    e.web_window_size_changed(canvas.width, canvas.height);
                }

                window.addEventListener('resize', function(event) {
                    send_resize();
                }, true);

                // Initial resize to fill screen
                send_resize();

                // Runs the "main loop".
                function do_main_update() {
                    if (!e.main_update()) {
                        e.main_end();

                        // Calls procedures marked with @fini
                        e._end();
                        return;
                    }
                    window.requestAnimationFrame(do_main_update);
                }

                window.requestAnimationFrame(do_main_update);
            },
            print: (function() {
                var element = document.getElementById("output");
                if (element) element.value = ''; // clear browser cache
                return function(text) {
                    if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                    console.log(text);
                    if (element) {
                      element.value += text + "\n";
                      element.scrollTop = element.scrollHeight; // focus on bottom
                    }
                };
            })(),
            canvas: (function() {
                return document.getElementById("canvas");
            })()
        };

        // ===========================================
        // Save Export/Import for Web Persistence
        // ===========================================

        // Export save - downloads save.json from Emscripten virtual filesystem
        function exportSave() {
            try {
                var data = FS.readFile('save.json', { encoding: 'utf8' });
                var blob = new Blob([data], { type: 'application/json' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'geometric_defense_save.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                console.log('Save exported successfully');
                return true;
            } catch (e) {
                console.log('No save file to export:', e);
                return false;
            }
        }

        // Import save - stores in localStorage, then reloads
        // On next page load, onRuntimeInitialized will write it to FS
        function importSave(file) {
            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    JSON.parse(e.target.result); // Validate JSON
                    localStorage.setItem('geometric_defense_pending_import', e.target.result);
                    console.log('Save staged for import, reloading...');
                    location.reload();
                } catch (err) {
                    console.error('Failed to import save:', err);
                    alert('Invalid save file');
                }
            };
            reader.readAsText(file);
        }

        // Trigger file picker for import
        function triggerImport() {
            document.getElementById('saveFileInput').click();
        }

        // Check for pending import and write to FS (called after FS is ready)
        function checkPendingImport() {
            var pending = localStorage.getItem('geometric_defense_pending_import');
            if (pending) {
                try {
                    FS.writeFile('save.json', pending);
                    localStorage.removeItem('geometric_defense_pending_import');
                    console.log('Pending save imported successfully');
                } catch (err) {
                    console.error('Failed to write pending import:', err);
                }
            }
        }

        // Expose to window for Odin access
        window.exportSave = exportSave;
        window.importSave = importSave;
        window.triggerImport = triggerImport;
        window.checkPendingImport = checkPendingImport;
    </script>

    <!-- IMPORTANT: Absolute path to Emscripten JS -->
    <script async type="text/javascript" src="/play/geometric-defense/index.js"></script>
</body>
</html>
